name: Windows

on:
  push:
    branches: [main, codex/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: node --test src/*.test.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test VPN core
        working-directory: zju-connect
        run: go test ./... -count=1
      - name: Vet VPN core
        working-directory: zju-connect
        run: go vet ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build Windows app
        run: wails build -s -skipbindings -m -nosyncgomod -trimpath
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: VPN-windows-amd64
          path: build/bin/VPN.exe
          if-no-files-found: error
