name: Linux

on:
  push:
    branches: [main, codex/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config xvfb xauth xdotool
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: node --test src/*.test.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test Linux packages
        run: go test -tags webkit2_41 ./...
      - name: Test Linux TUN device in isolated network namespace
        run: |
          go test -c -o "$RUNNER_TEMP/linux-engine-test" ./engine
          sudo env ECS_LINUX_TUN_SYSTEM_TEST=1 unshare --net "$RUNNER_TEMP/linux-engine-test" -test.run '^TestLinux(TUNDeviceOwnership|RoutesOwnership|RoutesConcurrentConflict|RoutesPartialFailureClosesOwner|TUNCrashCleanup|TUNConfiguredPacket|TUNConfigureFailureCleansDevice|TUNBlockedReadCloses|TUNIngressTCPUDP|TUNIngressPartialRouteFailure|TUNIngressDNSLifecycle|TUNIngressDNSFailureCleanup)$' -test.v
      - name: Test Linux TUN worker in isolated network namespace
        run: |
          go test -tags webkit2_41 -c -o "$RUNNER_TEMP/linux-worker-test" .
          sudo env ECS_LINUX_TUN_SYSTEM_TEST=1 unshare --net "$RUNNER_TEMP/linux-worker-test" -test.run '^TestLinux(WorkerProcessLifecycle|ManagerWorkerLifecycle|ManagerWorkerCrash|ManagerPolicyReplacement|ManagerMultipleAttachments)$' -test.v
      - name: Test GUI lifecycle with race detector
        run: go test -race -tags webkit2_41 . -run '^Test(LinuxShutdownWaits|WorkerRejectsNewAttachmentsAfterCleanupFailure|WorkerBlocksAfterReplacementCleanupFailure)' -count=1
      - name: Test headless lifecycle with race detector
        run: go test -race ./cmd/vpn-headless
      - name: Test DNS calls over isolated D-Bus
        run: |
          dbus-run-session -- sh -c 'export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" ECS_RESOLVED_BUS_TEST=1; exec go test ./engine -run "^TestResolvedPrivateBus" -count=1 -v'
      - name: Vet Linux packages
        run: go vet -tags webkit2_41 ./...
      - name: Test underlay networking
        working-directory: zju-connect
        run: go test ./underlay
      - name: Build Linux GUI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          wails build -tags webkit2_41 -skipbindings -nosyncgomod -trimpath
      - name: Smoke-test Linux GUI startup
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/gui-config"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          timeout -k 5s 120s xvfb-run -a bash -c '
            set -eu
            app_pid=
            cleanup() {
              if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; fi
            }
            trap cleanup EXIT
            for attempt in $(seq 1 5); do
              build/bin/VPN >"$RUNNER_TEMP/gui-$attempt.log" 2>&1 &
              app_pid=$!
              found=false
              for i in $(seq 1 200); do
                if xdotool search --name "^VPN$" >/dev/null 2>&1; then
                  found=true
                  break
                fi
                if ! kill -0 "$app_pid" 2>/dev/null; then
                  echo "GUI exited before opening a window" >&2
                  cat "$RUNNER_TEMP/gui-$attempt.log"
                  exit 1
                fi
                sleep .1
              done
              if [ "$found" != true ]; then
                echo "GUI window did not appear" >&2
                cat "$RUNNER_TEMP/gui-$attempt.log"
                exit 1
              fi
              kill -TERM "$app_pid"
              result=0
              wait "$app_pid" || result=$?
              app_pid=
              if [ "$result" -ne 0 ] && { [ "$result" -ne 143 ] || grep -q "Ctrl+C detected" "$RUNNER_TEMP/gui-$attempt.log"; }; then
                cat "$RUNNER_TEMP/gui-$attempt.log"
                echo "Unexpected GUI exit status: $result" >&2
                exit 1
              fi
              if grep -q "gtk_main_quit: assertion" "$RUNNER_TEMP/gui-$attempt.log"; then
                cat "$RUNNER_TEMP/gui-$attempt.log"
                exit 1
              fi
              echo "GUI startup and immediate shutdown passed: $attempt"
            done
          '
      - name: Test shutdown before GTK main loop
        run: timeout -k 5s 60s xvfb-run -a bash build/linux/gtk-early-shutdown-test.sh
      - name: Build and smoke-test Suite headless command
        run: |
          go build -o "$RUNNER_TEMP/vpn-headless-linux-amd64" ./cmd/vpn-headless
          "$RUNNER_TEMP/vpn-headless-linux-amd64" -h
      - name: Test headless client against mock gateway
        run: bash build/linux/headless-smoke-test.sh
      - name: Build existing upstream command line
        working-directory: zju-connect
        run: go build -o "$RUNNER_TEMP/zju-connect-linux-amd64" .
      - name: Package Linux artifacts
        run: |
          tar -czf "$RUNNER_TEMP/VPN-linux-amd64.tar.gz" -C build/bin VPN
          tar -czf "$RUNNER_TEMP/vpn-headless-linux-amd64.tar.gz" -C "$RUNNER_TEMP" vpn-headless-linux-amd64
      - name: Upload Linux GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-linux-amd64
          path: ${{ runner.temp }}/VPN-linux-amd64.tar.gz
          if-no-files-found: error
      - name: Upload Linux headless artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-headless-linux-amd64
          path: ${{ runner.temp }}/vpn-headless-linux-amd64.tar.gz
          if-no-files-found: error
