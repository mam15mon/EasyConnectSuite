name: Android

on:
  push:
    branches: [main, codex/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zju-connect/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20241204233305-ce44b2716d33
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20241204233305-ce44b2716d33
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test EasyConnect lifecycle with race detector
        working-directory: zju-connect
        run: go test -race ./client/easyconnect -count=1
      - name: Build Android engine
        run: bash build/android/build.sh
      - name: Compile Android tunnel tests
        working-directory: zju-connect
        run: |
          export GOOS=android GOARCH=amd64 CGO_ENABLED=1
          export CC="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          go test -c -o "$RUNNER_TEMP/android-tun-test" ./stack/tun
          go test -c -o "$RUNNER_TEMP/android-mobile-test" ./mobile
          go build -o "$RUNNER_TEMP/android-udp-probe" ../build/android/udp-probe.go
          go build -o "$RUNNER_TEMP/android-tcp-probe" ../build/android/tcp-probe.go
      - name: Build debug APK
        run: |
          mkdir -p android-app/app/libs
          cp build/android/zju-mobile.aar android-app/app/libs/
          gradle -p android-app testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: bash build/android/emulator-smoke-test.sh
